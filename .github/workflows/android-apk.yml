name: Android companion APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      # Retry transient repository throttling (HTTP 429) instead of failing the APK build.
      - name: Build debug APK (retry transient dependency throttling)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Android build attempt ${attempt}/3"
            if gradle -p android assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "Android build failed after 3 attempts"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: DioMasteR2D-Grokbot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
