name: Bloom adapter tests
on:
  push:
    branches: [auto-bloom-execution]
    paths:
      - "services/desk-gateway/**"
      - ".github/workflows/bloom-adapter-tests.yml"
  pull_request:
    branches: [auto-bloom-execution]
    paths:
      - "services/desk-gateway/**"
      - ".github/workflows/bloom-adapter-tests.yml"
permissions:
  contents: read
jobs:
  bloom-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.13.4"
      - name: Install gateway dependencies
        run: uv sync --project services/desk-gateway --all-groups
      - name: Run Bloom adapter tests
        run: uv run --project services/desk-gateway pytest services/desk-gateway/tests/test_bloom_execution.py services/desk-gateway/tests/test_bloom_autopilot.py
